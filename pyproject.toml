[project]
name = "req-agent"
version = "0.2.2"
description = "One-sentence requirement → full PRD document agent"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
req-agent = "req_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/req_agent"]
